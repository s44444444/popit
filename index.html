<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PopIt</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: #111;
    overflow: hidden;
    font-family: 'Press Start 2P', cursive;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #game-container {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 100%;
    max-height: 90vh;
    aspect-ratio: 9 / 16;
    overflow: hidden;
    border: 4px solid #ff6b6b;
    border-radius: 12px;
    box-shadow: 0 0 25px rgba(255, 100, 100, 0.5);
    cursor: crosshair;
    background: #000;
  }

  @media (max-width: 480px) {
    #game-container {
      max-width: 100vw;
      max-height: 100vh;
      border-radius: 0;
      border-left: none;
      border-right: none;
    }
  }

  #bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 200%;
    height: 100%;
    background-image: url('images/park_background.png');
    background-size: 50% 100%;
    background-repeat: repeat-x;
    animation: moveBg 25s linear infinite;
    z-index: 1;
    filter: brightness(0.92) contrast(0.95);
  }

  #bg::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(220, 230, 255, 0.13);
    pointer-events: none;
  }

  @keyframes moveBg {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
    20%, 40%, 60%, 80% { transform: translateX(8px); }
  }

  .shake {
    animation: shake 0.8s linear 6;
  }

  #score {
    position: absolute;
    top: 14px;
    left: 14px;
    font-size: clamp(13px, 4vw, 17px);
    font-weight: 900;
    color: #fff;
    z-index: 20;
    letter-spacing: 1px;
    text-shadow:
      -3px -3px 0 #000,
       3px -3px 0 #000,
      -3px  3px 0 #000,
       3px  3px 0 #000,
       0   -3px 0 #000,
       0    3px 0 #000,
      -3px  0   0 #000,
       3px  0   0 #000;
  }

  /* Centered game over message */
  #message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(13px, 3.8vw, 16px);
    color: #222;
    background: #f5e3b0;
    padding: 24px 16px 20px;
    border: 4px solid #ffeb3b;
    border-radius: 10px;
    display: none;
    z-index: 30;
    text-align: center;
    width: 88%;
    line-height: 1.8;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  #message img {
    width: 90px;
    height: 90px;
    margin-bottom: 12px;
    image-rendering: pixelated;
  }

  /* Game over red text with white border */
  .game-over-title {
    font-size: 1.2em;
    color: #ff1744;
    margin-bottom: 8px;
    text-shadow:
      -2px -2px 0 #fff,
       2px -2px 0 #fff,
      -2px  2px 0 #fff,
       2px  2px 0 #fff,
       0   -2px 0 #fff,
       0    2px 0 #fff,
      -2px  0   0 #fff,
       2px  0   0 #fff;
  }

  /* Other game-over text with white fill and black border */
  .game-over-info {
    color: #ffffff;
    margin: 3px 0;
    text-shadow:
      -2px -2px 0 #000,
       2px -2px 0 #000,
      -2px  2px 0 #000,
       2px  2px 0 #000,
       0   -2px 0 #000,
       0    2px 0 #000,
      -2px  0   0 #000,
       2px  0   0 #000;
  }

  #message .new-best {
    color: #ffeb3b;
    font-size: 0.85em;
    margin: 8px 0;
    text-shadow:
      -2px -2px 0 #000,
       2px -2px 0 #000,
      -2px  2px 0 #000,
       2px  2px 0 #000;
  }

  #message .btn-row {
    display: flex;
    gap: 14px;
    margin-top: 18px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .game-btn {
    font-family: 'Press Start 2P', cursive;
    font-size: clamp(11px, 3.2vw, 14px);
    color: #fff;
    border: 3px solid #222;
    padding: 12px 16px;
    cursor: pointer;
    box-shadow: 4px 4px 0 #222;
    transition: all 0.1s;
  }

  .game-btn:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 #222;
  }

  #restart-btn {
    background: #e91e63;
  }

  #share-btn {
    background: #2196f3;
  }

  #start-screen {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 40;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 22px;
    padding: 16px;
  }

  /* Multi-colored balloon styled PopIt logo */
  .popit-logo {
    display: flex;
    font-size: clamp(22px, 7vw, 32px);
    line-height: 1.2;
    text-shadow:
      -3px -3px 0 #000,
       3px -3px 0 #000,
      -3px  3px 0 #000,
       3px  3px 0 #000;
  }

  .popit-logo span {
    display: inline-block;
    animation: balloonFloat 2s ease-in-out infinite alternate;
  }

  .popit-logo span:nth-child(1) { color: #ff5252; animation-delay: 0.0s; } /* P */
  .popit-logo span:nth-child(2) { color: #ff4081; animation-delay: 0.2s; } /* o */
  .popit-logo span:nth-child(3) { color: #e040fb; animation-delay: 0.4s; } /* p */
  .popit-logo span:nth-child(4) { color: #00e676; animation-delay: 0.6s; } /* I */
  .popit-logo span:nth-child(5) { color: #ffeb3b; animation-delay: 0.8s; } /* t */

  @keyframes balloonFloat {
    0%   { transform: translateY(0px) scale(1); }
    100% { transform: translateY(-8px) scale(1.08); }
  }

  #name-input {
    font-family: 'Press Start 2P', cursive;
    font-size: clamp(12px, 3.8vw, 15px);
    padding: 12px 14px;
    width: 80%;
    max-width: 260px;
    border: 3px solid #fff;
    background: #222;
    color: #fff;
    text-align: center;
    outline: none;
  }

  #name-input::placeholder {
    color: #888;
  }

  #start-btn {
    font-family: 'Press Start 2P', cursive;
    font-size: clamp(15px, 4.8vw, 20px);
    color: #fff;
    background: #e91e63;
    border: 4px solid #fff;
    padding: 16px 26px;
    cursor: pointer;
    box-shadow: 6px 6px 0 #000;
    transition: all 0.1s;
    text-shadow:
      -2px -2px 0 #000,
       2px -2px 0 #000,
      -2px  2px 0 #000,
       2px  2px 0 #000;
  }

  #start-btn:hover,
  #start-btn:active {
    transform: translate(3px, 3px);
    box-shadow: 3px 3px 0 #000;
    background: #ff4081;
  }

  #shooter {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: 95px;
    height: 95px;
    z-index: 10;
    pointer-events: none;
    image-rendering: pixelated;
  }

  .balloon {
    position: absolute;
    width: 58px;
    height: 58px;
    z-index: 5;
    pointer-events: none;
    image-rendering: pixelated;
    transition: transform 0.15s ease-out, opacity 0.25s ease-out;
  }

  .balloon.pop {
    transform: scale(1.8);
    opacity: 0;
  }

  .bullet {
    position: absolute;
    width: 14px;
    height: 14px;
    background: radial-gradient(circle, #fff 15%, #ffeb3b 55%, #ff9800 100%);
    border-radius: 50%;
    box-shadow: 0 0 10px #ff0, 0 0 18px #ff9800;
    z-index: 8;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="game-container">
  <div id="bg"></div>

  <div id="score" style="display:none;">Score: 0</div>

  <div id="message"></div>

  <div id="start-screen">
    <h1 class="popit-logo">
      <span>P</span><span>o</span><span>p</span><span>I</span><span>t</span>
    </h1>
    <input type="text" id="name-input" placeholder="Enter your name" maxlength="12" autocomplete="off">
    <button id="start-btn">START</button>
  </div>

  <img id="shooter" src="images/shooter.png" alt="Shooter" style="display:none;">
</div>

<audio id="burst-sound" src="sounds/pop_sound1.mp3" preload="auto"></audio>
<audio id="gameover-sound" src="sounds/game_over.mp3" preload="auto"></audio>

<script>
  const container = document.getElementById('game-container');
  const scoreEl = document.getElementById('score');
  const messageEl = document.getElementById('message');
  const shooter = document.getElementById('shooter');
  const startScreen = document.getElementById('start-screen');
  const startBtn = document.getElementById('start-btn');
  const nameInput = document.getElementById('name-input');

  const burstSound = document.getElementById('burst-sound');
  const gameoverSound = document.getElementById('gameover-sound');

  const balloonImages = [
    'images/pink_ballon.png',
    'images/skyblue_ballon.png',
    'images/blue_ballon.png',
    'images/red_ballon.png',
    'images/green_ballon.png',
    'images/yellow_ballon.png'
  ];

  let score = 0;
  let bestScore = parseInt(localStorage.getItem('balloonBest') || '0', 10);
  let playerName = localStorage.getItem('balloonName') || '';
  let gameOver = false;
  let gameStarted = false;
  let balloons = [];
  let bullets = [];
  let animationId = null;
  let spawnTimer = null;
  let isNewBest = false;

  let GAME_WIDTH = 360;
  let GAME_HEIGHT = 640;

  if (playerName) nameInput.value = playerName;

  function updateSize() {
    const rect = container.getBoundingClientRect();
    GAME_WIDTH = rect.width;
    GAME_HEIGHT = rect.height;
  }

  function playSound(sound) {
    sound.currentTime = 0;
    sound.play().catch(() => {});
  }

  function startGame() {
    const name = nameInput.value.trim() || 'Player';
    playerName = name;
    localStorage.setItem('balloonName', playerName);

    updateSize();
    gameStarted = true;
    gameOver = false;
    isNewBest = false;

    container.classList.remove('shake');

    startScreen.style.display = 'none';
    scoreEl.style.display = 'block';
    shooter.style.display = 'block';
    messageEl.style.display = 'none';

    balloons.forEach(b => b.el.remove());
    bullets.forEach(b => b.el.remove());
    balloons = [];
    bullets = [];
    score = 0;
    scoreEl.textContent = 'Score: 0';

    if (animationId) cancelAnimationFrame(animationId);
    if (spawnTimer) clearInterval(spawnTimer);

    spawnTimer = setInterval(spawnBalloon, 1100);
    spawnBalloon();
    gameLoop();
  }

  function spawnBalloon() {
    if (gameOver || !gameStarted) return;

    const img = document.createElement('img');
    img.src = balloonImages[Math.floor(Math.random() * balloonImages.length)];
    img.className = 'balloon';

    const size = 52 + Math.random() * 22;
    img.style.width = size + 'px';
    img.style.height = size + 'px';

    const y = 40 + Math.random() * (GAME_HEIGHT * 0.32);
    img.style.left = '-70px';
    img.style.top = y + 'px';

    container.appendChild(img);

    balloons.push({
      el: img,
      x: -70,
      baseY: y,
      speed: 1.4 + Math.random() * 2.6,
      amplitude: 15 + Math.random() * 15,
      frequency: 0.03 + Math.random() * 0.02,
      size: size,
      popped: false
    });
  }

  function shoot(e) {
    if (!gameStarted || gameOver) return;

    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    const clientY = e.clientY || (e.touches && e.touches[0].clientY);

    const rect = container.getBoundingClientRect();
    const clickX = clientX - rect.left;
    const clickY = clientY - rect.top;

    const startX = GAME_WIDTH / 2;
    const startY = GAME_HEIGHT - 60;

    const dx = clickX - startX;
    const dy = clickY - startY;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;

    const speed = 13;
    const vx = (dx / dist) * speed;
    const vy = (dy / dist) * speed;

    const bulletEl = document.createElement('div');
    bulletEl.className = 'bullet';
    bulletEl.style.left = startX + 'px';
    bulletEl.style.top = startY + 'px';
    container.appendChild(bulletEl);

    bullets.push({
      el: bulletEl,
      x: startX,
      y: startY,
      vx: vx,
      vy: vy,
      hit: false
    });
  }

  function gameLoop() {
    if (gameOver || !gameStarted) return;

    for (let i = balloons.length - 1; i >= 0; i--) {
      const b = balloons[i];
      if (b.popped) continue;

      b.x += b.speed;
      b.y = b.baseY + Math.sin(b.x * b.frequency) * b.amplitude;

      b.el.style.left = b.x + 'px';
      b.el.style.top = b.y + 'px';

      if (b.x > GAME_WIDTH + 20) {
        b.el.remove();
        balloons.splice(i, 1);
        endGame();
        return;
      }
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
      const bullet = bullets[i];
      if (bullet.hit) continue;

      bullet.x += bullet.vx;
      bullet.y += bullet.vy;
      bullet.el.style.left = bullet.x + 'px';
      bullet.el.style.top = bullet.y + 'px';

      let hitSomething = false;

      for (let j = balloons.length - 1; j >= 0; j--) {
        const b = balloons[j];
        if (b.popped) continue;

        const bx = b.x + b.size / 2;
        const by = b.y + b.size / 2;
        const dist = Math.hypot(bullet.x - bx, bullet.y - by);

        if (dist < b.size / 2 + 10) {
          b.popped = true;
          b.el.classList.add('pop');
          setTimeout(() => b.el.remove(), 280);

          balloons.splice(j, 1);
          hitSomething = true;

          score++;
          scoreEl.textContent = 'Score: ' + score;

          playSound(burstSound);

          bullet.hit = true;
          bullet.el.remove();
          bullets.splice(i, 1);
          break;
        }
      }

      if (!hitSomething && (
          bullet.x < -30 || bullet.x > GAME_WIDTH + 30 ||
          bullet.y < -30 || bullet.y > GAME_HEIGHT + 30
      )) {
        bullet.el.remove();
        bullets.splice(i, 1);
        endGame();
        return;
      }
    }

    animationId = requestAnimationFrame(gameLoop);
  }

  function endGame() {
    if (gameOver) return;
    gameOver = true;
    clearInterval(spawnTimer);

    playSound(gameoverSound);

    container.classList.add('shake');
    setTimeout(() => container.classList.remove('shake'), 1000);

    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem('balloonBest', bestScore);
      isNewBest = true;
    }

    const newBestHtml = isNewBest
      ? `<div class="new-best">★ NEW BEST! ★</div>`
      : '';

    messageEl.innerHTML = `
      <img src="images/red_ballon.png" alt="Red Balloon">
      <div class="game-over-title">GAME OVER!</div>
      <div class="game-over-info">${playerName}</div>
      <div class="game-over-info">Score: ${score}</div>
      <div class="game-over-info">Best: ${bestScore}</div>
      ${newBestHtml}
      <div class="btn-row">
        <button class="game-btn" id="restart-btn">RESTART</button>
        <button class="game-btn" id="share-btn">SHARE</button>
      </div>
    `;
    messageEl.style.display = 'flex';

    document.getElementById('restart-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      startGame();
    });

    document.getElementById('share-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      shareStats();
    });
  }

  async function shareStats() {
    const text = `PopIt🎈\n` +
                 `Player: ${playerName}\n` +
                 `Score: ${score}\n` +
                 `Best: ${bestScore}` +
                 (isNewBest ? '\n★ NEW BEST! ★' : '');

    try {
      const canvas = await html2canvas(messageEl, {
        backgroundColor: '#f5e3b0',
        scale: 2,
        useCORS: true,
        logging: false
      });

      canvas.toBlob(async (blob) => {
        if (!blob) {
          fallbackShare(text);
          return;
        }

        const file = new File([blob], 'balloon-score.png', { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: 'PopIt',
            text: text
          });
        } else if (navigator.share) {
          await navigator.share({ title: 'PopIt', text: text });
          downloadImage(blob);
        } else {
          downloadImage(blob);
          try {
            await navigator.clipboard.writeText(text);
            alert('Screenshot downloaded & stats copied!');
          } catch {
            prompt('Copy your stats:', text);
          }
        }
      }, 'red_balloon.png');
    } catch (err) {
      console.error(err);
      fallbackShare(text);
    }
  }

  function downloadImage(blob) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'my_score.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function fallbackShare(text) {
    if (navigator.share) {
      navigator.share({ title: 'PopIt', text: text }).catch(() => {});
    } else {
      navigator.clipboard.writeText(text).then(() => {
        alert('Stats copied to clipboard!');
      }).catch(() => {
        prompt('Copy your stats:', text);
      });
    }
  }

  // Event listeners
  startBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    startGame();
  });

  startBtn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    e.stopPropagation();
    startGame();
  }, { passive: false });

  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') startGame();
  });

  container.addEventListener('click', shoot);
  container.addEventListener('touchstart', function(e) {
    if (e.target === startBtn || startScreen.contains(e.target) ||
        e.target.closest('#message')) return;
    e.preventDefault();
    shoot(e);
  }, { passive: false });

  window.addEventListener('resize', updateSize);
  window.addEventListener('load', updateSize);
</script>
</body>
</html>
